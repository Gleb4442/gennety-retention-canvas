<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13141B"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <style>
      .squircle {
        fill: url(#brandBg);
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 4;
      }
      @media (prefers-color-scheme: light) {
        .squircle {
          fill: #111217;
          stroke: rgba(0, 0, 0, 0.15);
        }
      }
    </style>
  </defs>
  <!-- Gennety Brand Liquid-Pill Squircle -->
  <rect class="squircle" x="2" y="2" width="508" height="508" rx="112"/>
  <!-- Gennety Butterfly Logo -->
  <image href="data:image/png;base64," x="0" y="0" width="512" height="512"/>
</svg>