<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gennety Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0A0C] text-zinc-100 font-sans antialiased overflow-hidden select-none">
    <div id="root"></div>

    <!-- Fallback if opened directly via file:// instead of http:// -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (root && root.children.length === 0) {
            root.innerHTML = `
              <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A0A0C; color: #F4F4F5; font-family: 'Inter', system-ui, sans-serif; padding: 24px;">
                <div style="max-width: 580px; background: rgba(18, 19, 24, 0.95); border: 1px solid #272730; border-radius: 16px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center;">
                  <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 20px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  </div>
                  <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #FFFFFF;">
                    Требуется веб-сервер (Vite)
                  </h2>
                  <p style="font-size: 13px; line-height: 1.6; color: #A1A1AA; margin-bottom: 24px;">
                    Вы открыли файл напрямую через <code style="background: #1F2028; padding: 2px 6px; border-radius: 4px; color: #E4E4E7; font-family: monospace;">file://</code>. Браузеры блокируют загрузку ES-модулей с диска по соображениям безопасности (CORS).
                  </p>
                  <div style="background: #14151B; border: 1px solid #272730; border-radius: 10px; padding: 16px; text-align: left; font-family: monospace; font-size: 12px; margin-bottom: 24px; color: #E4E4E7;">
                    <div style="color: #71717A; margin-bottom: 6px;">// Быстрый запуск в 1 клик на Mac:</div>
                    <div style="color: #FFFFFF; font-weight: 600;">Дважды кликните файл «Запустить (Start).command»</div>
                    <div style="color: #71717A; margin-top: 10px; margin-bottom: 6px;">// Либо через терминал:</div>
                    <div style="color: #E4E4E7;">npm run dev</div>
                  </div>
                  <p style="font-size: 11px; color: #71717A; margin: 0;">
                    Сервер уже запущен локально по адресу: <strong style="color: #FFFFFF;">http://localhost:5173</strong>
                  </p>
                </div>
              </div>
            `;
          }
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
